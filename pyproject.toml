[project]
name = "tg-roundtable"
version = "0.1.0"
description = "A Telegram group chat where several AI models (Claude Code, Codex, ...) talk with you and with each other, using your existing subscriptions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiogram>=3.13,<4"]

[project.scripts]
roundtable = "roundtable.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roundtable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "nookling"
version = "0.1.0"
description = "Nookling (小窝): a local-first AI family living in a 3D home you furnish; furniture carries their tools, chat apps like Telegram live on the house computer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiogram>=3.13,<4",
    "anthropic>=2.3.0",
    "mcp>=1.9",
]

[project.scripts]
nookling = "nookling.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nookling"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
